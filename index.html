<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>My Portfolio</title>
</head>

<body class="min-h-screen bg-[#f4f7f4] font-sans text-center text-[#183536] transition-colors duration-300">
    <h1 class="mx-auto max-w-6xl px-6 pt-10 text-4xl font-bold tracking-tight text-[#174541] sm:text-5xl">Jose Charls Busico</h1>
    <button id="switch" class="mt-4 rounded-full border border-[#d4dfd8] bg-white px-5 py-2 text-sm font-semibold text-[#183536] shadow-sm transition duration-300 hover:-translate-y-0.5 hover:border-[#174541] hover:bg-[#e7f2e8] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#174541]">Switch</button>
    <header class="mt-8 border-y border-[#d9e3dc] bg-white/70">
        <nav class="mx-auto flex max-w-6xl items-center justify-between gap-5 px-6 py-4 max-[600px]:flex-col">
            <span class="text-lg font-semibold tracking-tight text-[#174541]">Charls-duno</span>
            <ul class="m-0 flex list-none flex-wrap justify-center gap-x-6 gap-y-2 p-0">
                <li><a class="text-sm font-medium text-[#425a5b] transition-colors duration-300 hover:text-[#d85b3b]" href="#projects">Projects</a></li>
                <li><a class="text-sm font-medium text-[#425a5b] transition-colors duration-300 hover:text-[#d85b3b]" href="#services">Services</a></li>
                <li><a class="text-sm font-medium text-[#425a5b] transition-colors duration-300 hover:text-[#d85b3b]" href="#contact">Contact Me</a></li>
            </ul>
        </nav>
    </header>

    <main class="mx-auto my-8 grid max-w-6xl grid-cols-1 gap-5 px-6 py-6 md:grid-cols-2 xl:grid-cols-3 max-[600px]:my-4">
        <section id="projects" class="min-w-0 rounded-lg border border-[#d6e1dc] border-t-4 border-t-[#a7c94a] bg-white p-6 text-[#11624f] shadow-sm transition-shadow duration-300 hover:shadow-md">
            <h2 class="text-2xl font-bold text-[#173b39]">My Projects</h2>
            <p class="mt-3 text-[#536b6b]">My Portfolio</p>
        </section>

        <section id="services" class="min-w-0 rounded-lg border border-[#d6e1dc] border-t-4 border-t-[#e3a64a] bg-white p-6 text-[#b45a33] shadow-sm transition-shadow duration-300 hover:shadow-md">
            <h2 class="text-2xl font-bold">My Services</h2>
            <p class="mt-3 text-[#536b6b]">hehehe</p>
        </section>

        <section id="contact" class="min-w-0 rounded-lg border border-[#d6e1dc] border-t-4 border-t-[#d85b3b] bg-white p-6 shadow-sm transition-shadow duration-300 hover:shadow-md">
            <h2 class="text-2xl font-bold text-[#b45a33]">Let's build together!</h2>
            <form class="mt-6 flex flex-col gap-2 text-left" action="#">
                <!-- Name -->
                <label class="mt-2 text-sm font-semibold text-[#31494a]" for="name">Name</label>
                <input class="w-full rounded-md border border-[#ccd9d4] bg-[#f9fbf9] px-3 py-2.5 text-sm text-[#173b39] outline-none transition focus:border-[#5f8c56] focus:ring-2 focus:ring-[#dcebb2]" type="text" id="name" name="name" required>

                <!-- Email -->
                <label class="mt-2 text-sm font-semibold text-[#31494a]" for="email">Email</label>
                <input class="w-full rounded-md border border-[#ccd9d4] bg-[#f9fbf9] px-3 py-2.5 text-sm text-[#173b39] outline-none transition focus:border-[#5f8c56] focus:ring-2 focus:ring-[#dcebb2]" type="email" name="email" id="email" required>

                <!-- Message -->
                <label class="mt-2 text-sm font-semibold text-[#31494a]" for="message">Message</label>
                <textarea class="w-full resize-y rounded-md border border-[#ccd9d4] bg-[#f9fbf9] px-3 py-2.5 text-sm text-[#173b39] outline-none transition focus:border-[#5f8c56] focus:ring-2 focus:ring-[#dcebb2]" name="message" id="message" rows="5" required></textarea>

                <!-- Submit -->
                <button class="mt-3 rounded-md bg-[#174541] px-5 py-3 text-sm font-semibold text-white transition duration-300 hover:-translate-y-0.5 hover:bg-[#23645a] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#174541]" type="submit">Send Message</button>
            </form>
        </section>
    </main>
    <footer class="mx-auto max-w-6xl px-6 pb-8 text-xs text-[#647878]">Jose Charls Busico · Portfolio</footer>
    <script src="script.js"></script>
</body>

</html>
